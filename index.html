<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D.M.S 機密檔案庫</title>
  
  <!-- CSS：負責終端機黑底綠字與科技感外觀 -->
  <style>
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      border: 1px solid #00ff66;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 1px dashed #00ff66;
      padding-bottom: 10px;
      text-transform: uppercase;
    }
    .warning {
      color: #ff3333;
      font-weight: bold;
    }
    button {
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 10px 15px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 15px;
      width: 100%;
    }
    button:hover {
      background: #00ff66;
      color: #000;
    }
    #secret-file {
      display: none;
      margin-top: 20px;
      padding: 10px;
      background: #161b22;
      border-left: 3px solid #ff3333;
    }
  </style>
</head>
<body>

  <!-- HTML：網頁的骨架與內容 -->
  <div class="container">
    <h1>[D.M.S] 核心伺服器</h1>
    <p class="warning">⚠️ 警告：未授權人員存取將觸發實體清除程序。</p>
    <p>組織宗旨：以異常獵殺異常，以深淵反噬深淵。</p>

    <button onclick="unlockFile()">解鎖生物兵器 [DMS-001] 檔案</button>

    <div id="secret-file">
      <p style="color: #ff3333;">【機密檔案載入中...】</p>
      <p><strong>實體代號：</strong>滅行者 (Eradicator-01)</p>
      <p><strong>指定剋制對象：</strong>實體類 Euclid / Keter 級異常</p>
      <p><strong>培育狀態：</strong>第三階段基因融合完成</p>
    </div>
  </div>

  <!-- JavaScript：負責點擊解鎖的互動邏輯 -->
  <script>
    function unlockFile() {
      const file = document.getElementById("secret-file");
      if (file.style.display === "block") {
        file.style.display = "none";
      } else {
        file.style.display = "block";
      }
    }
  </script>

</body>
</html>
